<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading Time Estimator</title>
<style>
body{font-family:Arial;background:#ecfeff;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:15px}
textarea{width:100%;height:230px;padding:13px;box-sizing:border-box;border:1px solid #67e8f9;border-radius:8px}
input{width:100%}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}
.stat{background:#cffafe;padding:18px;border-radius:9px;text-align:center}
strong{font-size:25px;color:#0e7490}
</style>
</head>
<body>
<main>
<h1>Reading Time Estimator</h1>
<p>Paste your article to estimate reading time.</p>
<textarea id="text" placeholder="Paste or write your text here..."></textarea>

<label>Reading Speed: <span id="speedValue">200</span> words per minute</label>
<input id="speed" type="range" min="50" max="500" value="200">

<div class="stats">
<div class="stat">Word Count<br><strong id="words">0</strong></div>
<div class="stat">Characters<br><strong id="chars">0</strong></div>
<div class="stat">Reading Time<br><strong id="time">0 min</strong></div>
<div class="stat">Sentences<br><strong id="sentences">0</strong></div>
</div>
</main>
<script>
function estimate(){
 const text=document.getElementById("text").value;
 const speed=Number(document.getElementById("speed").value);
 const words=text.trim()?text.trim().split(/\s+/).length:0;
 const sentences=text.trim()?text.split(/[.!?]+/).filter(x=>x.trim()).length:0;

 const minutes=words/speed;
 let display;

 if(minutes===0)display="0 min";
 else if(minutes<1)display=Math.max(1,Math.ceil(minutes*60))+" sec";
 else display=Math.ceil(minutes)+" min";

 document.getElementById("words").textContent=words;
 document.getElementById("chars").textContent=text.length;
 document.getElementById("sentences").textContent=sentences;
 document.getElementById("time").textContent=display;
 document.getElementById("speedValue").textContent=speed;
}

document.getElementById("text").addEventListener("input",estimate);
document.getElementById("speed").addEventListener("input",estimate);
estimate();
</script>
</body>
</html>
