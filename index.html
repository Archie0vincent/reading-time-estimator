<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Time Estimator</title>
<style>
body{font-family:Arial;background:#f0fdfa;padding:25px}
main{max-width:700px;margin:auto;background:white;padding:30px;border-radius:16px}
textarea{width:100%;height:220px;padding:15px;box-sizing:border-box;border:1px solid #99f6e4;border-radius:8px}
input{width:100%;margin:15px 0}
#result{background:#ccfbf1;padding:25px;border-radius:10px;white-space:pre-line;line-height:2;font-size:20px}
button{background:#0d9488;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer;margin-top:15px}
</style>
</head>
<body>
<main>
<h1>Reading Time Estimator</h1>
<p>Estimate how long an article will take to read.</p>
<textarea id="text" placeholder="Paste your article here..." oninput="calculate()"></textarea>
<label>Reading Speed: <strong id="speedLabel"></strong> words/minute</label>
<input id="speed" type="range" min="50" max="500" value="200" oninput="calculate()">
<div id="result"></div>
<button onclick="clearText()">Clear Article</button>
</main>
<script>
function calculate(){
 const text=document.getElementById("text").value.trim();
 const speed=Number(document.getElementById("speed").value);
 const count=text?text.split(/\s+/).length:0;
 const seconds=Math.ceil(count/speed*60);
 const minutes=Math.floor(seconds/60);
 document.getElementById("speedLabel").textContent=speed;
 document.getElementById("result").textContent=
 "Total Words: "+count+
 "\nReading Time: "+minutes+" minutes "+seconds%60+" seconds";
}
function clearText(){
 document.getElementById("text").value="";
 calculate();
}
calculate();
</script>
</body>
</html>
